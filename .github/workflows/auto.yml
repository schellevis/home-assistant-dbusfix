name: Auto-build nieuwste HA-release

# Controleert dagelijks de nieuwste stabiele HA-release. Bestaat daarvoor nog
# geen image, dan wordt die gebouwd en als :<versie> én :latest gepusht.
# Faalt de build (bijv. aiohomekit-versieverschil), dan mailt GitHub je; dat
# is het signaal om te kijken of de fix upstream zit of de fork gerebased moet.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      build: ${{ steps.latest.outputs.build }}
    steps:
      - name: Bepaal nieuwste HA-release en of het image al bestaat
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/home-assistant-dbusfix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then
            echo "$image:$version bestaat al, niets te doen" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nieuwe HA-release $version, image wordt gebouwd" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ha_version: ${{ needs.check.outputs.version }}
      tag_latest: true
