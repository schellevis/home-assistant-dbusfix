name: Build Home Assistant (aiohomekit D-Bus fix)

on:
  workflow_dispatch:
    inputs:
      ha_version:
        description: "Officiële HA-versie, bijv. 2026.9.3 (geen stable/latest)"
        required: true
        type: string
      platforms:
        description: "Doelplatforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      allow_version_mismatch:
        description: "Bouwen ook als HA een andere aiohomekit-versie verwacht dan de fork"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ inputs.ha_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HA_VERSION: ${{ inputs.ha_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Valideer invoer en lees pins
        id: pins
        run: |
          set -euo pipefail
          if ! [[ "$HA_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+(b[0-9]+)?$ ]]; then
            echo "::error::Ongeldige HA_VERSION '$HA_VERSION' — gebruik een expliciete versie zoals 2026.9.3"
            exit 1
          fi
          source pins.env
          if ! [[ "$AIOHOMEKIT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::AIOHOMEKIT_REF in pins.env moet een volledige commit-hash zijn"
            exit 1
          fi
          {
            echo "repo=$AIOHOMEKIT_REPO"
            echo "ref=$AIOHOMEKIT_REF"
            echo "short=${AIOHOMEKIT_REF:0:7}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/home-assistant-dbusfix"
          } >> "$GITHUB_OUTPUT"

      - name: Vergelijk aiohomekit-versie van HA met de fork
        env:
          REPO: ${{ steps.pins.outputs.repo }}
          REF: ${{ steps.pins.outputs.ref }}
          ALLOW: ${{ inputs.allow_version_mismatch }}
        run: |
          set -euo pipefail
          manifest="https://raw.githubusercontent.com/home-assistant/core/${HA_VERSION}/homeassistant/components/homekit_controller/manifest.json"
          ha_req=$(curl -fsSL "$manifest" | jq -r '.requirements[] | select(startswith("aiohomekit=="))' | cut -d= -f3)
          fork_raw="${REPO/github.com/raw.githubusercontent.com}/${REF}/pyproject.toml"
          fork_ver=$(curl -fsSL "$fork_raw" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "HA ${HA_VERSION} vereist aiohomekit==${ha_req}; fork ${REF:0:7} is ${fork_ver}"
          echo "HA ${HA_VERSION} vereist aiohomekit **${ha_req}**, fork \`${REF:0:7}\` is **${fork_ver}**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ha_req" != "$fork_ver" ]]; then
            msg="Versieverschil: HA verwacht aiohomekit ${ha_req}, fork is ${fork_ver}. Controleer of de fix upstream zit (dan is dit image niet meer nodig) of rebase de fork."
            if [[ "$ALLOW" == "true" ]]; then
              echo "::warning::$msg"
            else
              echo "::error::$msg (zet allow_version_mismatch om toch te bouwen)"
              exit 1
            fi
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build en push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          build-args: |
            HA_VERSION=${{ env.HA_VERSION }}
            AIOHOMEKIT_REPO=${{ steps.pins.outputs.repo }}
            AIOHOMEKIT_REF=${{ steps.pins.outputs.ref }}
          tags: |
            ${{ steps.pins.outputs.image }}:${{ env.HA_VERSION }}
            ${{ steps.pins.outputs.image }}:${{ env.HA_VERSION }}-aiohomekit-${{ steps.pins.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Samenvatting
        run: |
          echo "Gepusht: \`${{ steps.pins.outputs.image }}:${HA_VERSION}\` (${{ inputs.platforms }})" >> "$GITHUB_STEP_SUMMARY"
